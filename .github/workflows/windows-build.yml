name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone application
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir --name SnapGrab --icon=assets/SnapGrab.ico
          --collect-all yt_dlp --collect-all imageio_ffmpeg
          --collect-all pystray --collect-all PIL main.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $version = "1.1.1"
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\SnapGrab.iss
      - uses: actions/upload-artifact@v4
        with:
          name: SnapGrab-Windows-Installer
          path: dist/installer/SnapGrab-Setup.exe
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
      - name: Install Android SDK and NDK
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Build pinned FFmpeg for ARM64
        run: |
          chmod +x android/scripts/build-ffmpeg.sh
          android/scripts/build-ffmpeg.sh
      - name: Prepare Android release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/snapgrab-release.jks"
          test -s "$RUNNER_TEMP/snapgrab-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/snapgrab-release.jks" >> "$GITHUB_ENV"
      - name: Build and verify Android release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gradle -p android :app:testReleaseUnitTest :app:assembleRelease
          mkdir -p dist/android/source
          cp "android/app/build/outputs/apk/release/app-release.apk" dist/android/SnapGrab-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/android/SnapGrab-Android.apk
          cp android/.build/downloads/ffmpeg-8.1.3.tar.xz android/.build/downloads/lame-3.100.tar.gz dist/android/source/
          cp android/scripts/build-ffmpeg.sh android/app/src/main/assets/THIRD_PARTY_NOTICES.md LICENSE dist/android/source/
          tar -czf dist/android/SnapGrab-FFmpeg-Source.tar.gz -C dist/android/source .
          rm -rf dist/android/source
      - name: Build and test Android debug
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: gradle -p android :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: SnapGrab-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: SnapGrab-Android-Release
          path: |
            dist/android/SnapGrab-Android.apk
            dist/android/SnapGrab-FFmpeg-Source.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SnapGrab-Windows-Installer
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: SnapGrab-Android-Release
          path: release-assets/android
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows/SnapGrab-Setup.exe
            release-assets/android/SnapGrab-Android.apk
            release-assets/android/SnapGrab-FFmpeg-Source.tar.gz
          generate_release_notes: true
          make_latest: true
