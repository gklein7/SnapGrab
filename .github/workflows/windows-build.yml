name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone application
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir --name SnapGrab
          --collect-all yt_dlp --collect-all imageio_ffmpeg
          --collect-all pystray --collect-all PIL main.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\SnapGrab.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: SnapGrab-Windows-Installer
          path: dist/installer/SnapGrab-Setup.exe
          if-no-files-found: error
